<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#090d16" />
    <meta name="description" content="ShieldAI Enterprise Fraud Detection Platform" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <title>ShieldAI - Fraud Detection & Risk Analysis</title>
    <!--
      Runtime API configuration.
      This is read by src/hooks/useLiveFraudData.js before React boots, which
      means one built bundle can be pointed at any backend by editing this
      single value - no rebuild required after changing the API host.

      Set it to the deployed backend, e.g. https://shieldai-api.up.railway.app
      Leave it empty to call the same origin that served the page.
    -->
    <script>
      // Only set a default if nothing has already configured it, so an
      // injected value (edge config, proxy, or console override) is preserved.
      window.__SHIELD_API__ = window.__SHIELD_API__ || '';
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
